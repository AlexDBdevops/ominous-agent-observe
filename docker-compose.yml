services:
  observe:
    build: .
    image: ominous-agent-observe:local
    container_name: ominous-agent-observe
    restart: unless-stopped
    environment:
      OBSERVE_MAX_EVENTS: "${OBSERVE_MAX_EVENTS:-50000}"
      OBSERVE_RETENTION_DAYS: "${OBSERVE_RETENTION_DAYS:-14}"
      OBSERVE_DETAIL: "${OBSERVE_DETAIL:-minimo}"
      OBSERVE_ALLOWED_HOSTS: "${OBSERVE_ALLOWED_HOSTS:-}"
    # Dentro del container escucha en 0.0.0.0; hacia fuera solo se publica
    # en localhost salvo que OBSERVE_BIND se cambie explícitamente.
    ports:
      - "${OBSERVE_BIND:-127.0.0.1}:${OBSERVE_PORT:-4982}:4982"
    # No monta nada de tu equipo: los eventos llegan por HTTP y los tokens los
    # manda el hook de tokens (solo números). Solo escribe en su volumen.
    volumes:
      - observe-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  observe-data:
